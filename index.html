  waiting:   { label: "В пути / на складе", color: "#8a7a5c", bg: "#f3ede0" },
  sold:      { label: "Продан",             color: "#9c4a2e", bg: "#f7e9e2" },
  reserved:  { label: "Резерв",             color: "#3a5a8c", bg: "#e8edf6" },
  cancelled: { label: "Отменён",            color: "#8a8a8a", bg: "#efefef" }
};
const STORAGE_KEY = "sales-overrides-v1";

let overrides = {};
try { overrides = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch (e) { overrides = {}; }
let query = "";
let statusFilter = "all";
let countryFilter = "all";
let openId = null;

function getItems() {
  return INITIAL.map((base) => {
    const o = overrides[base.id];
    return o ? Object.assign({}, base, o) : base;
  });
}

function persist() {
  const el = document.getElementById("saveIndicator");
  el.textContent = "Сохранение…";
  el.className = "save-indicator";
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(overrides));
    el.textContent = "Сохранено";
    setTimeout(() => { el.textContent = ""; }, 1000);
  } catch (e) {
    el.textContent = "Ошибка сохранения";
    el.className = "save-indicator error";
  }
}

function updateItem(id, patch) {
  const base = INITIAL.find((d) => d.id === id);
  const prev = overrides[id] || {};
  const merged = Object.assign({}, base, prev, patch);
  const next = Object.assign({}, prev, patch);
  Object.keys(next).forEach((k) => { if (merged[k] === base[k]) delete next[k]; });
  if (Object.keys(next).length === 0) delete overrides[id];
  else overrides[id] = next;
  persist();
  render();
}

function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function fmtDate(d) {
  if (!d) return "";
  const [y, m, day] = d.split("-");
  return `${day}.${m}.${y}`;
}

function render() {
  const items = getItems();
  const counts = { all: items.length, waiting: 0, sold: 0, reserved: 0, cancelled: 0 };
  items.forEach((it) => { counts[it.status] = (counts[it.status] || 0) + 1; });

  const kpiRow = document.getElementById("kpiRow");
  const sold = counts.sold || 0;
  const total = counts.all || 0;
  const share = total ? Math.round((sold / total) * 100) : 0;
  kpiRow.innerHTML = `
    <div class="kpi"><div class="kpi-value">${total}</div><div class="kpi-label">Всего</div></div>
    <div class="kpi"><div class="kpi-value">${sold}</div><div class="kpi-label">Продано</div></div>
    <div class="kpi"><div class="kpi-value">${share}%</div><div class="kpi-label">Доля продано</div></div>
  `;

  const filterRow = document.getElementById("filterRow");
  const chips = [["all", "Все", "#3a3226", "#3a3226"]].concat(
    Object.entries(STATUS_META).map(([k, m]) => [k, m.label, m.color, m.bg])
  );
  filterRow.innerHTML = chips.map(([key, label, color, bg]) => {
    const active = statusFilter === key;
    const style = active
      ? `--c:${color};--bg:${key === "all" ? "#3a3226" : bg};background:${key === "all" ? "#3a3226" : bg};color:${key === "all" ? "#fff" : color};border-color:${color}`
      : "";
    return `<button class="chip${active ? " active" : ""}" style="${style}" data-status="${key}">${label} <span class="count">${counts[key] || 0}</span></button>`;
  }).join("");

  const q = query.trim().toLowerCase();
  const filtered = items.filter((it) => {
    if (statusFilter !== "all" && it.status !== statusFilter) return false;
    if (countryFilter !== "all" && (it.country || "") !== countryFilter) return false;
    if (!q) return true;
    return `${it.lot} ${it.vin} ${it.model} ${it.buyer} ${it.auction}`.toLowerCase().includes(q);
  });

  const list = document.getElementById("list");
  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty">Ничего не найдено под текущий фильтр</div>`;
  } else {
    list.innerHTML = filtered.map((it) => rowHtml(it)).join("");
  }

  document.getElementById("footerInfo").textContent =
    `Показано ${filtered.length} из ${items.length} · отметки сохраняются на устройстве`;

  bindEvents();
}

function rowHtml(it) {
  const meta = STATUS_META[it.status] || STATUS_META.waiting;
  const open = openId === it.id;
  const statusButtons = Object.entries(STATUS_META).map(([k, m]) => {
    const active = it.status === k;
    return `<button class="status-btn${active ? " active" : ""}" style="${active ? `--c:${m.color};--bg:${m.bg};border-color:${m.color};background:${m.bg};color:${m.color}` : ""}" data-action="status" data-id="${it.id}" data-value="${k}">${m.label}</button>`;
  }).join("");

  const modelLine = [it.model, it.year].filter(Boolean).join(" ");
  return `
  <div class="row" data-row="${it.id}">
    <div class="row-main" data-action="toggle" data-id="${it.id}">
      <div class="dot" style="background:${meta.color}"></div>
      <div class="code-block">
        <span class="code-text">${escapeHtml(it.lot || "—")}</span>
        <span class="vin-text">${fmtDate(it.date)}</span>
      </div>
      <div class="note-text">${escapeHtml(modelLine || "—")} · ${escapeHtml(it.vin || "")}</div>
      <div class="badge" style="color:${meta.color};background:${meta.bg}">${meta.label}</div>
      <svg class="chev${open ? " open" : ""}" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#b5a98a" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
    </div>
    <div class="row-detail${open ? " open" : ""}">
      <div class="field">
        <label class="field-label">Статус</label>
        <div class="status-buttons">${statusButtons}</div>
      </div>
      <div class="detail-grid-2">
        <div class="field">
          <label class="field-label">Аукцион</label>
          <input value="${escapeHtml(it.auction)}" disabled />
        </div>
        <div class="field">
          <label class="field-label">Страна</label>
          <input data-action="country" data-id="${it.id}" value="${escapeHtml(it.country)}" placeholder="Россия / Монголия" />
        </div>
      </div>
      <div class="field">
        <label class="field-label">Покупатель / заметка</label>
        <input data-action="buyer" data-id="${it.id}" value="${escapeHtml(it.buyer)}" placeholder="напр. Алтан-Булаг" />
      </div>
      <div class="field">
        <label class="field-label">VIN</label>
        <input value="${escapeHtml(it.vin)}" disabled />
      </div>
    </div>
  </div>`;
}

function bindEvents() {
  document.querySelectorAll('[data-action="toggle"]').forEach((el) => {
    el.onclick = () => { openId = openId === el.dataset.id ? null : el.dataset.id; render(); };
  });
  document.querySelectorAll('[data-action="status"]').forEach((el) => {
    el.onclick = (e) => { e.stopPropagation(); updateItem(el.dataset.id, { status: el.dataset.value }); };
  });
  document.querySelectorAll('[data-action="buyer"]').forEach((el) => {
    el.onblur = () => updateItem(el.dataset.id, { buyer: el.value });
  });
  document.querySelectorAll('[data-action="country"]').forEach((el) => {
    el.onblur = () => updateItem(el.dataset.id, { country: el.value });
  });
  document.querySelectorAll(".chip").forEach((el) => {
    el.onclick = () => { statusFilter = el.dataset.status; render(); };
  });
}

document.getElementById("searchInput").addEventListener("input", (e) => {
  query = e.target.value;
  document.getElementById("clearBtn").style.display = query ? "flex" : "none";
  render();
});
document.getElementById("clearBtn").addEventListener("click", () => {
  query = "";
  document.getElementById("searchInput").value = "";
  document.getElementById("clearBtn").style.display = "none";
  render();
});
document.getElementById("countryFilter").addEventListener("change", (e) => {
  countryFilter = e.target.value;
  render();
});

render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
